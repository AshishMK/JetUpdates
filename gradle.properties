# Project-wide Gradle settings.

# Optimized JVM options (TieredCompilation re-enabled, memory balanced for CI & local)
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Xmx6g -Xms2g

# Kotlin Daemon JVM arguments
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g -Xms1g

# Parallel execution & Caching
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=true

# Configuration Cache
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# AndroidX & Build Features
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Testing Configurations
roborazzi.test.verify=true
android.injected.androidTest.leaveApksInstalledAfterRun=true
ksp.project.isolation.enabled=true