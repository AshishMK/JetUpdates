# Query to fetch all shop categories
query GetCategories {
  categories {
    id
    name
    imageUrl
  }
}

# Query to fetch shop items with category details
query GetShopItems($first: Int = 10, $skip: Int = 0) {
  shopItems(first: $first, skip: $skip) {
    id
    title
    description
    price
    images
    categoriesRef {
      id
      name
      imageUrl
    }
  }
}

# Query to fetch a single shop item by ID
query GetShopItemById($id: ID!) {
  shopItem(where: { id: $id }) {
    id
    title
    description
    price
    images
    categoriesRef {
      id
      name
      imageUrl
    }
  }
}


# Sync Categories updated after a specific timestamp
query SyncCategories($lastSyncTime: DateTime) {
  categories(where: { updatedAt_gt: $lastSyncTime }) {
    id
    name
    imageUrl
    updatedAt
  }
}

# Sync ShopItems updated after a specific timestamp
query SyncShopItems($lastSyncTime: DateTime) {
  shopItems(where: { updatedAt_gt: $lastSyncTime }) {
    id
    title
    description
    price
    images
    updatedAt
    categoriesRef {
      id
    }
  }
}


# 1. Fetch lightweight category change list (ID, timestamp, and delete status)
query GetCategoryChangeList($after: DateTime, $first: Int = 100) {
  categories(where: { updatedAt_gt: $after }, first: $first) {
    id
    updatedAt
    isDeleted
  }
}

# 2. Fetch lightweight shop item change list (ID, timestamp, and delete status)
query GetShopItemChangeList($after: DateTime, $first: Int = 100) {
  shopItems(where: { updatedAt_gt: $after }, first: $first) {
    id
    updatedAt
    isDeleted
  }
}

# 3. Fetch full category payloads by a batch of IDs
query GetCategoriesByIds($ids: [ID!]) {
  categories(where: { id_in: $ids }) {
    id
    name
    shortDescription
    longDescription
    imageUrl
    url
    updatedAt
    isDeleted
  }
}

# 4. Fetch full shop item payloads by a batch of IDs
query GetShopItemsByIds($ids: [ID!]) {
  shopItems(where: { id_in: $ids }) {
    id
    title
    description
    price
    stock
    images
    updatedAt
    isDeleted
    type
    publishDate
    categories

  }
}